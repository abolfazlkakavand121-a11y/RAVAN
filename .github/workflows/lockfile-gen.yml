name: Temporary Cargo.lock generation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lockfile-gen.yml

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock and print it for repository commit
        run: |
          cargo generate-lockfile
          echo "----- BEGIN CARGO LOCK -----"
          cat Cargo.lock
          echo "----- END CARGO LOCK -----"
