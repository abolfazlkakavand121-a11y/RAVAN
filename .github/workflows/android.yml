name: Android ARM64 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ravan-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 30.0.16248370

jobs:
  android-arm64:
    name: Build Android ARM64 (API 21+)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Install pinned Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Rust stable and Android ARM64 target
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.100.0
          targets: aarch64-linux-android

      - name: Verify Android toolchain
        run: |
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          aarch64-linux-android21-clang --version
          rustc --version
          rustup target list --installed

      - name: Build locked Android ARM64 release binary
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android21-clang
          CC_aarch64_linux_android: aarch64-linux-android21-clang
          AR_aarch64_linux_android: llvm-ar
        run: cargo build --locked --release --target aarch64-linux-android

      - name: Verify Android ELF architecture and interpreter
        run: |
          BIN="target/aarch64-linux-android/release/ravan"
          test -s "$BIN"
          file "$BIN"
          readelf -h "$BIN" | grep -q 'ELF64'
          readelf -h "$BIN" | grep -q 'AArch64'
          readelf -l "$BIN" | grep -F '/system/bin/linker64'

      - name: Package binary and checksum
        run: |
          mkdir -p dist
          install -m 0755 target/aarch64-linux-android/release/ravan dist/ravan-android-arm64
          (
            cd dist
            sha256sum ravan-android-arm64 > ravan-android-arm64.sha256
            tar -czf ravan-android-arm64.tar.gz ravan-android-arm64
          )
          ls -lh dist

      - name: Upload Android ARM64 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ravan-android-arm64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
